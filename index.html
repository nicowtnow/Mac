<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pear Inc.</title>
    <style>
        body { background: #ffffff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
        
        /* Barra azul superior */
        .navbar { height: 44px; background: linear-gradient(to bottom, #4a90e2 0%, #1c5fa6 100%); color: white; text-align: center; line-height: 44px; font-weight: bold; position: sticky; top: 0; border-bottom: 1px solid #103d6d; }
        
        /* Icono con reflejo */
        .app-icon { width: 100px; height: 100px; background: #333; border-radius: 20px; margin: 20px auto; -webkit-box-reflect: below 5px linear-gradient(transparent, transparent 50%, rgba(0,0,0,0.2)); }
        
        /* Lista de menús estilo nativo */
        .menu-container { margin: 20px; border: 1px solid #ccc; border-radius: 10px; overflow: hidden; }
        .menu-item { background: white; border-bottom: 1px solid #eee; padding: 15px; color: #333; font-weight: bold; display: block; text-decoration: none; }
        
        /* Slider (El toque JailbreakMe) */
        #slider-container { width: 280px; height: 44px; background: #ccc; margin: 20px auto; border-radius: 25px; position: relative; overflow: hidden; }
        #slider-thumb { width: 60px; height: 40px; background: #007aff; border-radius: 20px; position: absolute; left: 2px; top: 2px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="navbar" id="nav">Pear Inc.</div>

    <div class="app-icon"></div>

    <div class="menu-container">
        <a href="#" class="menu-item" onclick="changeView('Repo')">Instalar Repositorio</a>
        <a href="#" class="menu-item" onclick="changeView('Paquetes')">Paquetes Disponibles</a>
        <a href="#" class="menu-item" onclick="changeView('Config')">Configuración 5D</a>
    </div>

    <div id="slider-container">
        <div id="slider-thumb" onmousedown="conectarRepo()"></div>
    </div>

    <script>
        function changeView(viewName) {
            document.getElementById('nav').innerText = viewName;
            alert("Cargando sección: " + viewName);
        }

        function conectarRepo() {
            alert("Conectando con el repositorio de Pear Inc...");
            // Aquí irá la lógica de tu repo
        }
    </script>
</body>
</html>
